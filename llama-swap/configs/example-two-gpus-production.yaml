      -ngl 99
      -lv 4
      -rea auto
      --flash-attn on
      --parallel 1
      --spec-type draft-mtp
      --spec-draft-n-max 3
      --batch-size 768
      --ubatch-size 192
      --threads 8
      --ctx-size 105000
      -ctk q4_0
      -ctv q4_0
      --temp 0.6
      --top_k 30
      --top-p 0.95
      --presence_penalty 1.2
      --repeat-penalty 1.1
      --reasoning-effort low
      --reasoning-budget 4092
      --jinja
      --no-mmproj
      --cache-ram 0
      --host 0.0.0.0
      --port ${PORT}
      --metrics
    env:
    - CUDA_VISIBLE_DEVICES=
    - LD_LIBRARY_PATH=/home/timoti/Downloads/llama-b1347-rocm-gfx120X
    - HIP_VISIBLE_DEVICES=1
    ttl: 900

  # Strata HIP engine (RX 9070, Qwen3.8-Flash-Next, ctx 256k, int8 KV + WMMA);
  # the engine binds ${PORT} only after the weights load (~3 min cold start).
  # Engine web UI on that port: "/" app, "/api-monitor" dashboard
  # (engine JSON: "api_monitor": true to keep request history,
  # "host": "0.0.0.0" to open it to the LAN; port from llama-swap /running).
  qwen3.8-flash-IQ3_S:
    name: qwen3.8-flash-IQ3_S
    description: 'GPU: Gigabyte RX 9070 (HIP1, PCIe x16) - Strata engine'
    capabilities:
      context: 256000
      tools: false
    cmd: >-
      /media/timoti/Data/repos/Strata/.venv/bin/python /media/timoti/Data/repos/Strata/serve/server.py
      --engine strata
      --config /media/timoti/Data/repos/Strata/strata-iq3_s.json
      --port ${PORT}
    env:
    - STRATA_REQUEST_LINES=1
    - HIP_VISIBLE_DEVICES=1
    ttl: 86400

  qwen3.8-flash-IQ3_XXS:
