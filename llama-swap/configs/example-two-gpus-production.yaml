      context: 200000
      tools: false
    cmd: >-
      ${latest-llama}
      --model /media/timoti/Data/lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-mtp.gguf
      --device Vulkan1
      -ngl 99
      -lv 3
      -rea auto
      --reasoning-preserve
      --flash-attn on
      --parallel 1
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --batch-size 2048
      --ubatch-size 1024
      --threads 8
      --ctx-size 209000
      -ctk q8_0
      -ctv q4_0
      --temp 0.6
      --top_k 30
      --top-p 0.95
      --presence_penalty 1.2
      --repeat-penalty 1.1
      --reasoning-effort low
      --reasoning-budget 4092
      --jinja
      --no-mmproj
      --cache-ram 0
      --host 0.0.0.0
      --port ${PORT}
      --metrics
    env:
    - CUDA_VISIBLE_DEVICES=
    - VK_DRIVER_FILES=/home/timoti/mesa-build/radeon_icd.json
    ttl: 900

  qwen3.8-27b-IQ3XXS-Uncensored:
    name: qwen3.8-27b-IQ3XXS-Uncensored
    description: 'GPU: Gigabyte RX 9070 (Vulkan1 / HIP1, PCIe x16)'
    capabilities:
      context: 130000
      tools: false
    cmd: >-
      ${latest-llama}
      --model /media/timoti/Data/lmstudio/models/RentedNoodle/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored-MTP.gguf
      --device Vulkan1
      -ngl 99
      -lv 3
      -rea auto
      --no-reasoning-preserve
      --flash-attn on
      --parallel 1
      --spec-type draft-mtp
      --spec-draft-n-max 2
      --spec-draft-backend-sampling
      --batch-size 1024
      --ubatch-size 1024
      --threads 8
      --ctx-size 261000
      -ctk q8_0
      -ctv q4_0
      --temp 0.6
      --top_k 20
      --top-p 0.95
      --min-p 0.0
      --reasoning-effort low
      --reasoning-budget 4096
      --jinja
      --mmproj /media/timoti/Data/lmstudio/models/RentedNoodle/Qwen3.8-27B-GSQ-RCO-IQ3_XXS-Uncensored/mmproj-Qwen3.8-27B-Q5_K-MIX.gguf
      --cache-ram 0
      --host 0.0.0.0
      --port ${PORT}
      --metrics
    env:
    - CUDA_VISIBLE_DEVICES=
    - VK_DRIVER_FILES=/home/timoti/mesa-build/radeon_icd.json
    ttl: 900

  qwen3.8-27b-IQ3S-ROCm:
    name: qwen3.8-27b-IQ3S-ROCm
    description: 'GPU: Gigabyte RX 9070 (HIP1, PCIe x16), ROCm backend'
    capabilities:
      context: 105000
      tools: false
    cmd: >-
      ${rocm-llama}
      --model /media/timoti/Data/lmstudio/models/unsloth/Qwen3.8-27B-GGUF/Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp.gguf
