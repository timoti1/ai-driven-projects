# Real-world reference: two AMD RX 9070 GPUs, matrix router (one model per GPU
# can stay loaded together), llama.cpp Vulkan/ROCm + a custom engine.
# Paths, GPU indices and env below are specific to the reference host;
# adapt them to your machine. See docs/04-groups-and-routing.md.

logLevel: debug
logToStdout: both
healthCheckTimeout: 500
metricsMaxInMemory: 1000
captureBuffer: 15
sendLoadingState: true
includeAliasesInList: false
globalTTL: 1800
unloadTimeout: 300

performance:
  disabled: false
  every: 15s

upstream:
  ignorePaths:
  - '.*\.(js|json|css|png|gif|jpg|jpeg|ico|txt|svg|woff|woff2|map|webp)$'
  - '^/metrics$'
  - '^/health$'
  - '^/mcp$'
  - '^/props$'
  - '^/slots$'
  - '^/status$'
  - '^/v1/status$'
  - '^/v1/models$'
  - '^/config$'
  - '^/settings$'
  - '^/api/requests$'
  - '^/api-monitor$'
  - '^/load$'
  - '^/unload$'
  - '^/v1/unload$'
  - '^/v1/vram$'
  - '^/switcher$'

ui:
  activity:
    session_id:
    - X-Session-ID
    - X-Litellm-Session-Id

routing:
  router:
    use: matrix
    settings:
      matrix:
        # vars: short names -> model ids
        # GPU Gigabyte (Vulkan1/ROCm0/HIP1), GPU Sapphire (Vulkan0/HIP0)
        vars:
          # Gigabyte
          tiel: tiel-coder-35b-a3b
          xxl: qwen3.8-27b-IQ3XXS
          xxsrocm: qwen3.8-27b-IQ3XXS-Uncensored
          iq3xxs: qwen3.8-27b-IQ3XXS-Uncensored
          iq3srocm: qwen3.8-27b-IQ3S-ROCm
          flashS: qwen3.8-flash-IQ3_S
          flashX: qwen3.8-flash-IQ3_XXS
          # Sapphire
          sapphire: qwen3.8-27b-IQ3XXS-Uncensored-Sapphire
          c2xxs: qwen3.8-27b-IQ3XXS-Uncensored-C2
          # Sapphire twins (same packs as the Gigabyte models)
          xxls: qwen3.8-27b-IQ3XXS-Sapphire
          iq3srocms: qwen3.8-27b-IQ3S-ROCm-Sapphire
        # slow to reload (huge weights) -> keep loaded when possible
        evict_costs:
          flashS: 10
          flashX: 10
        # allowed combinations: one Gigabyte model + one Sapphire model;
        # any single model is a subset and allowed too
        sets:
          pair: "(xxl|xxsrocm|iq3xxs|iq3srocm|flashS|flashX) & (sapphire|c2xxs|xxls|iq3srocms)"

macros:
  latest-llama: /home/timoti/Downloads/llama-latest/build/bin/llama-server
  rocm-llama: /home/timoti/Downloads/llama-rocm-gfx120X/llama-server
  ik-cpu-llama: /home/timoti/Downloads/ik-llama.cpp/build-cpu/bin/llama-server

models:
  # ---------- Gigabyte RX 9070 (Vulkan1 / HIP1, PCIe x16) ----------

  tiel-coder-35b-a3b:
    name: tiel-coder-35b-a3b
    description: 'GPU: Gigabyte RX 9070 (Vulkan1 / HIP1, PCIe x16)'
    capabilities:
      context: 110000
      tools: false
    cmd: >-
      ${latest-llama}
      --model /media/timoti/Data/lmstudio/models/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/Tiel-Coder-35B-A3B-MTP-UD-IQ4_XS.gguf
      --spec-type draft-mtp
      --spec-draft-backend-sampling
      --spec-draft-n-max 2
      --device Vulkan1
      -ngl 99
      -lv 4
      -rea auto
      --flash-attn on
      --n-cpu-moe 12
      --parallel 1
      --batch-size 2048
      --ubatch-size 1024
      --threads 8
      --ctx-size 155000
      -ctk q4_0
      -ctv q4_0
      --temp 0.6
      --top_k 20
      --top-p 0.95
      --min-p 0.0
      --presence_penalty 1.2
      --repeat-penalty 1.1
      --reasoning-effort low
      --reasoning-budget 2048
      --jinja
      --no-mmproj
      --cache-ram 4096
      --host 0.0.0.0
      --port ${PORT}
      --metrics
    env:
    - CUDA_VISIBLE_DEVICES=
    - VK_DRIVER_FILES=/home/timoti/mesa-build/radeon_icd.json
    ttl: 900

  qwen3.8-27b-IQ3XXS:
    name: qwen3.8-27b-IQ3XXS
    description: 'GPU: Gigabyte RX 9070 (Vulkan1 / HIP1, PCIe x16)'
