[Unit]
Wants=lactd.service

[Service]
# lactd.service orders itself After=multi-user.target, so a plain After=lactd
# here creates an ordering cycle and systemd drops our start job at boot.
# Wait for it at runtime instead (soft: continue anyway after 20s).
ExecStartPre=/bin/sh -c 'for i in $(seq 1 40); do systemctl is-active --quiet lactd.service && exit 0; sleep 0.5; done; exit 0'
